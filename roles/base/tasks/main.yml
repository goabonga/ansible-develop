---
- name: Ensure the state directory exists
  ansible.builtin.file:
    path: "{{ base_state_dir }}"
    state: directory
    mode: "0755"

- name: Write the managed marker file
  ansible.builtin.copy:
    dest: "{{ base_state_dir }}/managed"
    content: "Managed by ansible-develop. Local changes are overwritten.\n"
    mode: "0644"
